spring:
  application:
    name: veterinaria

  datasource:
    url: ${VET_DB_URL:jdbc:postgresql://localhost:5256/veterinaria}
    username: ${VET_DB_USER:veterinaria_app}
    password: ${VET_DB_PASSWORD:veterinaria_dev_pwd}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el unico dueno del esquema; Hibernate solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: America/Bogota
    deserialization:
      fail-on-unknown-properties: true

  servlet:
    multipart:
      # El limite real por tipo lo aplica vet.archivos.* (50 MB; DICOM mayor); aqui el tope tecnico del contenedor.
      max-file-size: ${VET_MULTIPART_MAX_FILE:260MB}
      max-request-size: ${VET_MULTIPART_MAX_REQUEST:262MB}

server:
  port: ${VET_PORT:9010}

vet:
  jwt:
    # Clave de desarrollo; en produccion se sobreescribe con VET_JWT_SECRET (min 32 chars).
    secret: ${VET_JWT_SECRET:cambie-esta-clave-secreta-de-desarrollo-0123456789abcdef}
    expiration-minutes: ${VET_JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${VET_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    seed-admin: ${VET_SEED_ADMIN:true}
  catalogos:
    seed: ${VET_SEED_CATALOGOS:true}
  # ---- Fase 3: comunicaciones y recordatorios ----
  clinica:
    nombre: ${VET_CLINICA_NOMBRE:Clinica Veterinaria}
  public-url: ${VET_PUBLIC_URL:http://localhost:9010}   # base de los enlaces de baja (opt-out) de los correos
  mail:
    # Si host esta vacio se usa el adaptador simulado (registra y marca ENVIADO_SIMULADO).
    host: ${VET_MAIL_HOST:}
    port: ${VET_MAIL_PORT:587}
    username: ${VET_MAIL_USER:}
    password: ${VET_MAIL_PASSWORD:}
    from: ${VET_MAIL_FROM:no-reply@veterinaria.local}
    starttls: ${VET_MAIL_STARTTLS:true}
  recordatorios:
    enabled: ${VET_RECORDATORIOS_ENABLED:true}
    cron: ${VET_RECORDATORIOS_CRON:0 0 8 * * *}        # generacion diaria (hora de la clinica)
    hora-envio: ${VET_RECORDATORIOS_HORA_ENVIO:08:00}   # hora en que se programan los envios
    intervalo-envio-ms: ${VET_RECORDATORIOS_INTERVALO_MS:300000}   # cola/reintentos
    max-intentos: ${VET_RECORDATORIOS_MAX_INTENTOS:3}
    reintento-minutos: ${VET_RECORDATORIOS_REINTENTO_MIN:30}

  # ---- Etapa A: archivos clinicos y laboratorio ----
  archivos:
    ruta: ${VET_ARCHIVOS_RUTA:./data/archivos}          # en Docker: /data/archivos (volumen veterinaria_archivos)
    max-bytes: ${VET_ARCHIVOS_MAX_BYTES:52428800}       # 50 MB (imagenes, PDF, texto)
    max-bytes-dicom: ${VET_ARCHIVOS_MAX_BYTES_DICOM:268435456}   # 256 MB para DICOM
    miniatura-px: ${VET_ARCHIVOS_MINIATURA_PX:400}
  laboratorio:
    # Clave de analizadores/LIS para /api/laboratorio/integracion/** (cabecera X-API-Key). Vacia = integracion deshabilitada.
    api-key: ${VET_LAB_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
